name: Trigger-All-Workflows

on:
  workflow_dispatch:
    inputs:
      jdc_ax1800_pro_wifi:
        description: "Run JDC-AX1800-PRO (WiFi)"
        required: false
        type: boolean
        default: true
      jdc_ax1800_pro_nowifi:
        description: "Run JDC-AX1800-PRO-NOWIFI"
        required: false
        type: boolean
        default: true
  schedule:
    - cron: "0 12 * * 6"

permissions:
  contents: read
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger JDC-AX1800-PRO (WiFi)
        if: ${{ github.event_name == 'schedule' || inputs.jdc_ax1800_pro_wifi }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run JDC-AX1800-PRO.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"

      - name: Trigger JDC-AX1800-PRO-NOWIFI
        if: ${{ github.event_name == 'schedule' || inputs.jdc_ax1800_pro_nowifi }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run JDC-AX1800-PRO-NOWIFI.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
