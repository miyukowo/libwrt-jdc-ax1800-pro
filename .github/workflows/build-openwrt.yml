name: Build OpenWrt

on:
  workflow_call:
    inputs:
      repo_url:
        description: "OpenWrt source repository URL"
        required: true
        type: string
      repo_branch:
        description: "Branch to build from"
        required: true
        type: string
      config_file:
        description: "Path to .config file"
        required: true
        type: string
      diy_script:
        description: "DIY customization script"
        required: false
        default: ""
        type: string
      firmware_tag:
        description: "Firmware tag for release naming"
        required: true
        type: string
      firmware_description:
        description: "Short firmware description for release body"
        required: true
        type: string
      install_extra_packages:
        description: "Whether to install extra packages (netspeedtest)"
        required: false
        default: false
        type: boolean
      kernel_version_file:
        description: "Kernel version file to grep (e.g. kernel-6.12). Leave empty to extract from manifest."
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

env:
  TZ: Asia/Ho_Chi_Minh

jobs:
  Build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: write
    concurrency:
      group: build-${{ inputs.firmware_tag }}-${{ github.ref }}
      cancel-in-progress: false

    steps:
    - name: Check Server Performance
      run: |
        echo "⚠️ WARNING"
        echo "The allocated server performance is limited. If you select too many plugins, please pay attention to CPU performance!"
        echo -e "Known CPU models (descending order): 7763, 8370C, 8272CL, 8171M, E5-2673 \n"
        echo "-------------------------- CPU Info --------------------------"
        echo "Number of physical CPUs: $(cat /proc/cpuinfo | grep "physical id" | sort | uniq | wc -l)"
        echo -e "CPU core info: $(cat /proc/cpuinfo | grep name | cut -f2 -d: | uniq -c) \n"
        echo "-------------------------- Memory Info --------------------------"
        echo "Installed memory details:"
        echo -e "$(sudo lshw -short -C memory | grep GiB) \n"
        echo "-------------------------- Disk Info --------------------------"
        echo "Number of disks: $(ls /dev/sd* | grep -v [1-9] | wc -l)" && df -hT

    - name: Initialize Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        docker images -q | xargs -r docker rmi
        sudo rm -rf /usr/share/dotnet /etc/apt/sources.list.d /usr/local/lib/android $AGENT_TOOLSDIRECTORY
        sudo -E apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
        sudo -E apt-get -y update
        sudo -E apt-get -y install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
          g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
          libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev \
          libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lld llvm lrzsz mkisofs msmtp \
          nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-pyelftools \
          python3-setuptools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
          upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
        sudo -E apt-get -y autoremove --purge
        sudo -E apt-get -y clean
        sudo -E systemctl daemon-reload
        sudo timedatectl set-timezone "$TZ"

    - name: Combine Disks
      uses: easimon/maximize-build-space@master
      with:
        swap-size-mb: 1024
        temp-reserve-mb: 100
        root-reserve-mb: 1024

    - name: Checkout
      uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Clone Source Code
      env:
        REPO_URL: ${{ inputs.repo_url }}
        REPO_BRANCH: ${{ inputs.repo_branch }}
      run: |
        df -hT $GITHUB_WORKSPACE
        git clone --depth 1 -b "$REPO_BRANCH" --single-branch "$REPO_URL" openwrt
        cd openwrt
        echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV
        VERSION_INFO=$(git show -s --date=short --format="Author: %an<br/>Date: %cd<br/>Message: %s<br/>Hash: %H")
        echo "VERSION_INFO=$VERSION_INFO" >> $GITHUB_ENV

    - name: Extract Kernel Version
      env:
        KERNEL_VERSION_FILE: ${{ inputs.kernel_version_file }}
      run: |
        cd $OPENWRT_PATH
        if [ -n "$KERNEL_VERSION_FILE" ] && [ -f "target/linux/generic/$KERNEL_VERSION_FILE" ]; then
          VERSION_KERNEL=$(grep -oP 'LINUX_KERNEL_HASH-\K[0-9]+\.[0-9]+\.[0-9]+' "target/linux/generic/$KERNEL_VERSION_FILE" || echo "unknown")
        else
          VERSION_KERNEL="extracted-after-build"
        fi
        echo "VERSION_KERNEL=$VERSION_KERNEL" >> $GITHUB_ENV

    - name: Generate Variables
      env:
        REPO_URL: ${{ inputs.repo_url }}
        REPO_BRANCH: ${{ inputs.repo_branch }}
        CONFIG_FILE: ${{ inputs.config_file }}
      run: |
        cp "$CONFIG_FILE" $OPENWRT_PATH/.config
        cd $OPENWRT_PATH
        make defconfig > /dev/null 2>&1
        SOURCE_REPO="${REPO_URL##*/}"
        SOURCE_REPO="${SOURCE_REPO%.git}"
        DEVICE_TARGET="$(awk -F '"' '/CONFIG_TARGET_BOARD/ {print $2; exit}' .config)"
        DEVICE_SUBTARGET="$(awk -F '"' '/CONFIG_TARGET_SUBTARGET/ {print $2; exit}' .config)"
        HASH="$(git log -1 --pretty=format:'%h')"
        CACHE_PREFIX="${SOURCE_REPO}-${REPO_BRANCH}-${DEVICE_TARGET}-${DEVICE_SUBTARGET}"
        CACHE_KEY="${CACHE_PREFIX}-${HASH}"
        {
          echo "SOURCE_REPO=$SOURCE_REPO"
          echo "DEVICE_TARGET=$DEVICE_TARGET"
          echo "DEVICE_SUBTARGET=$DEVICE_SUBTARGET"
          echo "HASH=$HASH"
          echo "CACHE_PREFIX=$CACHE_PREFIX"
          echo "CACHE_KEY=$CACHE_KEY"
        } >> $GITHUB_ENV

    - name: Cache Toolchain
      uses: actions/cache@v4
      with:
        key: ${{ env.CACHE_KEY }}
        restore-keys: |
          ${{ env.CACHE_PREFIX }}-
        path: |
          ${{ env.OPENWRT_PATH }}/staging_dir

    - name: Refresh The Cache
      run: |
        if [ -d "$OPENWRT_PATH/staging_dir" ]; then
          find "$OPENWRT_PATH/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r dir; do
            find "$dir" -type f -exec touch {} +
          done
        fi

    - name: Install Feeds
      run: |
        cd $OPENWRT_PATH
        ./scripts/feeds update -a
        if [ "${{ inputs.install_extra_packages }}" = "true" ]; then
          git clone --depth 1 https://github.com/sbwml/openwrt_pkgs.git package/new/custom
          mv package/new/custom/luci-app-netspeedtest package/new
          mv package/new/custom/speedtest-cli package/new
          rm -rf package/new/custom
        fi
        ./scripts/feeds install -a

    - name: Load Custom Configuration
      env:
        CONFIG_FILE: ${{ inputs.config_file }}
        DIY_SCRIPT: ${{ inputs.diy_script }}
      run: |
        [ -e files ] && mv files $OPENWRT_PATH/files
        [ -e "$CONFIG_FILE" ] && mv "$CONFIG_FILE" $OPENWRT_PATH/.config
        if [ -n "$DIY_SCRIPT" ] && [ -e "$DIY_SCRIPT" ]; then
          chmod +x "$DIY_SCRIPT"
          cd $OPENWRT_PATH
          "$GITHUB_WORKSPACE/$DIY_SCRIPT"
        fi

    - name: Download DL Packages
      run: |
        cd $OPENWRT_PATH
        make defconfig
        make download -j$(nproc)
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile Firmware
      id: compile
      run: |
        cd $OPENWRT_PATH
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        echo "DATE=$(date +"%Y-%m-%d %H:%M:%S")" >> $GITHUB_ENV
        echo "FILE_DATE=$(date +"%Y.%m.%d")" >> $GITHUB_ENV

    - name: Check Space Usage
      if: (!cancelled())
      run: df -hT

    - name: Upload Bin Directory
      if: steps.compile.outputs.status == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.SOURCE_REPO }}-bin-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-${{ env.FILE_DATE }}
        path: ${{ env.OPENWRT_PATH }}/bin

    - name: Organize Files
      if: steps.compile.outputs.status == 'success'
      run: |
        cd $OPENWRT_PATH/bin/targets/*/*
        cat sha256sums
        # Extract kernel version from manifest if not already set
        if [ "$VERSION_KERNEL" = "extracted-after-build" ]; then
          VERSION_KERNEL=$(find -type f -name "*.manifest" -exec grep -oP '^kernel - \K.*?(?=~|-\d+-)' {} \; || echo "unknown")
          echo "VERSION_KERNEL=$VERSION_KERNEL" >> $GITHUB_ENV
        fi
        cp $OPENWRT_PATH/.config build.config
        # Handle both .apk and .ipk package formats
        if ls $OPENWRT_PATH/bin/packages/*/*/*.apk 1>/dev/null 2>&1; then
          mv -f $OPENWRT_PATH/bin/packages/*/*/*.apk packages
        elif ls $OPENWRT_PATH/bin/packages/*/*/*.ipk 1>/dev/null 2>&1; then
          mv -f $OPENWRT_PATH/bin/packages/*/*/*.ipk packages
        fi
        tar -zcf Packages.tar.gz packages
        rm -rf packages feeds.buildinfo version.buildinfo
        echo "FIRMWARE_PATH=$PWD" >> $GITHUB_ENV

    - name: Upload Firmware To Artifact
      if: steps.compile.outputs.status == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.SOURCE_REPO }}-firmware-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}-${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE_PATH }}

    - name: Extract Short Commit Hash
      run: echo "SHORT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

    - name: Release Firmware
      if: steps.compile.outputs.status == 'success'
      uses: ncipollo/release-action@v1
      with:
        name: R${{ env.FILE_DATE }}-${{ env.SHORT_HASH }} for ${{ inputs.firmware_tag }}
        allowUpdates: false
        tag: ${{ env.FILE_DATE }}-${{ env.SHORT_HASH }}-${{ inputs.firmware_tag }}
        token: ${{ secrets.GITHUB_TOKEN }}
        artifacts: ${{ env.FIRMWARE_PATH }}/*
        body: |
          ### General Info
          **This is LiBwrt (OpenWrt) firmware for ${{ inputs.firmware_tag }}**
          - Compiled by @miyukowo

          ### 📒 Firmware Info
          - ${{ inputs.firmware_description }}
          - 💻 Platform: ${{ inputs.firmware_tag }}
          - ⚽ Firmware source: ${{ inputs.repo_url }}
          - 💝 Source branch: ${{ inputs.repo_branch }}
          - 🌐 Default address: 192.168.1.1
          - 🔑 Default password: password

          ### 🧊 Firmware Version
          - Kernel version: ${{ env.VERSION_KERNEL }}
          - Last update before build from ➦[Source repo](${{ inputs.repo_url }})
          - ${{ env.VERSION_INFO }}
        generateReleaseNotes: false
        makeLatest: legacy
        replacesArtifacts: true

    - name: Delete Old Cache
      if: steps.compile.outputs.status == 'success'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh cache list --key "${CACHE_PREFIX}-" --json key --jq '.[].key' |
          while read -r key; do
            [ -n "$key" ] || continue
            if [ "$key" != "$CACHE_KEY" ]; then
              gh cache delete "$key" || true
            fi
          done
        echo "========cache status========"
        if [ -d "$OPENWRT_PATH/staging_dir" ]; then
          echo "staging: $(du -sh "$OPENWRT_PATH/staging_dir" | cut -f 1)"
        fi
